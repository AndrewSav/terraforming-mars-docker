name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  # Each platform builds on a native runner and pushes its image by digest only;
  # the merge job then publishes the multi-arch tag. arm64 used to build under
  # QEMU emulation, where npm ci intermittently died with SIGILL and hung the
  # job until the 6-hour limit.
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout this
        uses: actions/checkout@v7
        with:
          path: build
      - name: Export version to variable
        run: |
            export TM_SHA=$(cat build/sha)
            echo "TM_SHA=$TM_SHA" >> $GITHUB_ENV
        shell: bash
      - name: Checkout tm
        uses: actions/checkout@v7
        with:
          repository: terraforming-mars/terraforming-mars
          path: tm
          ref: ${{ env.TM_SHA }}
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/${{ matrix.arch }}
          context: tm
          tags: andrewsav/terraforming-mars
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Create and push multi-arch tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create -t andrewsav/terraforming-mars:latest \
            $(printf 'andrewsav/terraforming-mars@sha256:%s ' *)
          docker buildx imagetools inspect andrewsav/terraforming-mars:latest
